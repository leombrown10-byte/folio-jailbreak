name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile kos (ARMv7 musl)
        run: build/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kos
          path: build/dist/kos

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kos
      - uses: softprops/action-gh-release@v2
        with:
          files: kos
