name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile kos (ARMv7 musl)
        run: build/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: kos
          path: build/dist/kos

  natives:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build kreader (MuPDF), mobitool, ddjvu
        run: build/fetch-deps.sh
      - uses: actions/upload-artifact@v7
        with:
          name: natives
          path: |
            build/dist/kreader
            build/dist/mobitool
            build/dist/ddjvu

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, natives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
