[package]
name = "kos"
version = "0.1.0"
edition = "2021"

[dependencies]
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "aac", "isomp4", "alac"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
